name: Package Desktop · Windows · x64 and ARM64

on:
  push:
    branches:
      - codex/windows-package-0.2.2-alpha.2
      - codex/jingwork-desktop-0.2.2-rc.2
  workflow_dispatch:
    inputs:
      version:
        description: Product version to package
        required: true
        default: 0.2.2-alpha.2
        type: string
      internal_update:
        description: Build a JingWork internal installer with background updates
        default: false
        type: boolean
      update_origin:
        description: HTTPS download origin for internal updates, without a path
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            arch: x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      PACKAGE_VERSION: ${{ inputs.version || (github.ref_name == 'codex/windows-package-0.2.2-alpha.2' && '0.2.2-alpha.2' || '0.2.2-rc.2') }}
      PACKAGE_INTERNAL_UPDATE: ${{ inputs.internal_update || false }}
      PACKAGE_UPDATE_ORIGIN: ${{ inputs.update_origin }}
    concurrency:
      group: windows-development-package-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Restore prepared target resources
        uses: actions/cache@v6.1.0
        with:
          key: desktop-preparation-v1-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: desktop-preparation-v1-${{ runner.os }}-${{ matrix.target }}-
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/runtime
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/electron
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/dsh
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/runtime-cache.json
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/dsh-cache.json
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check requested product version
        run: |
          $versions = @('package.json', 'apps/desktop/package.json') | ForEach-Object {
            (Get-Content -Raw $_ | ConvertFrom-Json).version
          }
          if (($versions | Select-Object -Unique).Count -ne 1 -or $versions[0] -ne $env:PACKAGE_VERSION) {
            throw "Expected both manifests to declare $env:PACKAGE_VERSION; found $($versions -join ', ')"
          }
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant() -ne '${{ matrix.arch }}') {
            throw 'The runner architecture does not match the package target'
          }
      - name: Configure internal update distribution
        if: inputs.internal_update
        run: |
          $origin = [Uri]$env:PACKAGE_UPDATE_ORIGIN
          if (-not $origin.IsAbsoluteUri -or $origin.Scheme -ne 'https' -or
              $origin.AbsolutePath -ne '/' -or $origin.UserInfo -or $origin.Query -or $origin.Fragment) {
            throw 'Internal updates require an HTTPS origin without a path or credentials'
          }
          @(
            'DSH_DESKTOP_APP_ID=com.jingwork.desktop'
            'DSH_DESKTOP_PRODUCT=jingwork'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production'
            "DOWNLOAD_PROD_ORIGIN=$($origin.GetLeftPart([UriPartial]::Authority))"
          ) | Set-Content -LiteralPath 'apps/desktop/.env.windows' -Encoding utf8
      - name: Build unsigned or internal installer
        run: |
          $env:DSH_DESKTOP_TARGET_PLATFORM = 'win32'
          $env:DSH_DESKTOP_TARGET_ARCH = '${{ matrix.arch }}'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if ($env:PACKAGE_INTERNAL_UPDATE -eq 'true') {
              pnpm --dir apps/desktop run package:win:x64:internal --build-version $env:PACKAGE_VERSION
            } else {
              pnpm run package:desktop:win:${{ matrix.arch }}:unsigned -- --build-version $env:PACKAGE_VERSION
            }
            $packageExit = $LASTEXITCODE
            if ($packageExit -eq 0) { exit 0 }
            $record = Get-ChildItem 'apps/desktop/.desktop-build/packaging-runs' -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
            if ($null -eq $record) { exit $packageExit }
            $logs = @((Join-Path $record.FullName 'stdout.log'), (Join-Path $record.FullName 'stderr.log'))
            $diagnostic = (Get-Content -LiteralPath $logs -Raw -ErrorAction SilentlyContinue) -join "`n"
            if ($attempt -eq 3 -or $diagnostic -notmatch '(Response code|primary runtime download:) (502|503|504)|ECONNRESET|ETIMEDOUT|EAI_AGAIN') {
              exit $packageExit
            }
            Write-Host "Transient dependency download failure; retrying with prepared resources (attempt $($attempt + 1)/3)."
            Start-Sleep -Seconds 10
          }
      - name: Record installer checksum
        id: artifacts
        run: |
          $mode = if ($env:PACKAGE_INTERNAL_UPDATE -eq 'true') { 'internal' } else { 'unsigned' }
          $directory = "apps/desktop/.desktop-build/targets/${{ matrix.target }}/$mode-artifacts"
          $installer = "$directory/deepseek-harness-$env:PACKAGE_VERSION-${{ matrix.target }}-$mode.exe"
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $installer
          "directory=$directory" >> $env:GITHUB_OUTPUT
          "### ${{ matrix.target }} installer`n`n$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($installer))" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: JingWork-Windows-${{ matrix.target }}-${{ env.PACKAGE_VERSION }}
          compression-level: 0
          include-hidden-files: true
          path: |
            ${{ steps.artifacts.outputs.directory }}/*.exe
            ${{ steps.artifacts.outputs.directory }}/*.blockmap
            ${{ steps.artifacts.outputs.directory }}/*.yml
            ${{ steps.artifacts.outputs.directory }}/*-release.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-package-logs-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
          retention-days: 14
